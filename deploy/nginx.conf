# Install in nginx's http context (for example /etc/nginx/conf.d/teacherdesk.conf).
# Obtain a certificate covering both teacherdesk.ru and www.teacherdesk.ru first.
server {
    listen 80;
    server_name teacherdesk.ru www.teacherdesk.ru;
    return 301 https://teacherdesk.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name www.teacherdesk.ru;
    ssl_certificate /etc/letsencrypt/live/teacherdesk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacherdesk.ru/privkey.pem;
    return 301 https://teacherdesk.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name teacherdesk.ru;
    ssl_certificate /etc/letsencrypt/live/teacherdesk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacherdesk.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    client_max_body_size 16k;

    location = /tutors { return 301 /features/; }
    location = /tutors/ { return 301 /features/; }
    location = /students { return 301 /features/kabinet-uchenika/; }
    location = /students/ { return 301 /features/kabinet-uchenika/; }
    location = /contact { return 301 /about/; }
    location = /contact/ { return 301 /about/; }
    location = /careers { return 301 /about/; }
    location = /careers/ { return 301 /about/; }

    # Forward /api/* verbatim. Do not add slashes or redirect POST requests.
    # Registration redirects and canonical page slashes are handled by the app.
    location / {
        proxy_pass http://127.0.0.1:8131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace user-supplied XFF; TRUST_PROXY=true is safe with this boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
}
