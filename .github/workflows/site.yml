name: Проверка и пакеты TeacherDesk

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать фронтенд на GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teacherdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Проверки сервера и Pages
        env:
          DATA_DIR: ${{ runner.temp }}/teacherdesk-test-data
          ADMIN_TOKEN: ci-only-test-token-not-a-production-secret-2026
        run: python3 -m unittest discover -s tests -v
      - name: Собрать все страницы для проверки
        run: |
          python3 build/build.py
          python3 build/sync_home.py
      - name: Проверить JavaScript
        run: |
          for script in site/assets/js/*.js; do
            node --check "$script"
          done
      - name: Подготовить GitHub Pages
        run: python3 deploy/pages.py .pages-preview/TD --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Упаковать фронтенд и бэкенд
        run: python3 deploy/package.py dist/teacherdesk-server.zip
      - name: Сохранить артефакт Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-preview/TD
          include-hidden-files: true
          retention-days: 14
      - name: Сохранить архив сервера
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: teacherdesk-server
          path: dist/teacherdesk-server.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Проверить настройки Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Опубликовать подготовленный фронтенд
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
