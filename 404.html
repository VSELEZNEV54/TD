<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · TeacherDesk</title>
<meta name="robots" content="noindex">
<script>
/* Только для GitHub Pages. Прототип переехал в папку prototype/: старые ссылки на концепции открывают его там. */
(function () {
  var base = /github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
  var rest = location.pathname.slice(base.length);
  if (/^([123]|assets|shared)(\/|$)|^architecture\.html$/.test(rest)) location.replace(base + 'prototype/' + rest + location.search + location.hash);
  else document.addEventListener('DOMContentLoaded', function () { document.getElementById('home').href = base; });
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F6F9;color:#22232E;font-family:-apple-system,"Segoe UI",Arial,sans-serif;text-align:center;padding:24px}
p{color:#6B6D7E;margin:16px 0 32px}a{color:#3547C0}
</style>
</head>
<body>
<div><h1 style="font-weight:500;margin:0">Страница не найдена</h1><p>Такой страницы нет или адрес изменился.</p><a id="home" href="/">Открыть прототип</a></div>
</body>
</html>
